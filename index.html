document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

=\"margin:0;font:700 clamp(22px,2.4vw,32px)/1.1 Archivo,sans-serif;letter-spacing:-0.02em;color:#10233A\">Preguntas frecuentes<\u002Fh2>\n                <div style=\"display:flex;flex-direction:column;border-top:1px solid rgba(16,35,58,.14)\">\n                  <sc-for list=\"{{ faqs }}\" as=\"fq\" hint-placeholder-count=\"5\">\n                    <div style=\"border-bottom:1px solid rgba(16,35,58,.14)\">\n                      <button type=\"button\" sc-camel-on-click=\"{{ fq.toggle }}\" aria-expanded=\"{{ fq.abierto }}\" style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;padding:18px 0;border:0;background:none;color:#10233A;font:500 17px/1.35 Archivo,sans-serif;text-align:left;cursor:pointer\">\n                        {{ fq.q }}<span aria-hidden=\"true\" style=\"{{ fq.icono }}\">+<\u002Fspan><\u002Fbutton>\n                      <sc-if value=\"{{ fq.abierto }}\">\n                        <p style=\"margin:0;padding:0 0 20px;max-width:70ch;font:400 15px/1.6 Archivo,sans-serif;color:#10233A\">{{ fq.a }}<\u002Fp>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ ladoFijo }}\" hint-placeholder-val=\"{{ true }}\">\n              <aside style=\"position:sticky;top:88px;display:flex;flex-direction:column;gap:14px;min-width:0\">\n                <div style=\"display:flex;flex-direction:column;gap:16px;padding:20px;border:1px solid rgba(16,35,58,.14);background:#F2F0EC\">\n                  <div style=\"display:flex;flex-direction:column;gap:2px\">\n                    <span style=\"font:700 clamp(30px,3.4vw,40px)/1 Archivo,sans-serif;letter-spacing:-0.03em;color:#C42B1C;font-variant-numeric:tabular-nums\">{{ uPrecio }}<\u002Fspan>\n                    <span style=\"font:400 13px/1.4 Archivo,sans-serif;color:#6E7378\">Precio en pesos mexicanos, más IVA<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:3px;padding:12px 0;border-top:1px solid rgba(16,35,58,.14);border-bottom:1px solid rgba(16,35,58,.14)\">\n                    <span style=\"font:500 16px/1.3 Archivo,sans-serif;color:#10233A;font-variant-numeric:tabular-nums\">{{ uMensual }}<\u002Fspan>\n                    <button type=\"button\" sc-camel-on-click=\"{{ irFinanciamiento }}\" style=\"align-self:flex-start;padding:0;border:0;background:none;color:#C42B1C;font:400 13px/1.3 Archivo,sans-serif;cursor:pointer;border-bottom:1px solid #C42B1C\">Ver esquemas y calculadora<\u002Fbutton>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:9px\">\n                    <sc-for list=\"{{ uDatos }}\" as=\"dt\" hint-placeholder-count=\"3\">\n                      <div style=\"display:flex;justify-content:space-between;gap:12px\">\n                        <span style=\"font:400 14px/1.4 Archivo,sans-serif;color:#6E7378\">{{ dt.k }}<\u002Fspan>\n                        <span style=\"font:500 14px/1.4 Archivo,sans-serif;color:#10233A;font-variant-numeric:tabular-nums;text-align:right\">{{ dt.v }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:8px\">\n                    <a href=\"{{ uWa }}\" style=\"display:flex;align-items:center;justify-content:center;height:52px;border-radius:2px;background:#C42B1C;color:#F2F0EC;font:500 16px/1 Archivo,sans-serif\" style-hover=\"background:#10233A;color:#F2F0EC;text-decoration:none\">Escribir por WhatsApp<\u002Fa>\n                    <button type=\"button\" sc-camel-on-click=\"{{ abrirModalCotizacion }}\" style=\"height:52px;border:1px solid #10233A;border-radius:2px;background:none;color:#10233A;font:500 16px/1 Archivo,sans-serif;cursor:pointer;transition:background .16s ease-out,color .16s ease-out\" style-hover=\"background:#10233A;color:#F2F0EC\">Pedir cotización formal<\u002Fbutton>\n                    <button type=\"button\" sc-camel-on-click=\"{{ abrirModalApartar }}\" style=\"height:52px;border:1px solid rgba(16,35,58,.32);border-radius:2px;background:none;color:#10233A;font:500 16px/1 Archivo,sans-serif;cursor:pointer;transition:background .16s ease-out\" style-hover=\"background:#E3E0DA\">Apartar con anticipo<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:14px;padding:16px;border:1px solid rgba(16,35,58,.14);background:#E3E0DA\">\n                  <div aria-hidden=\"true\" style=\"display:flex;align-items:center;justify-content:center;width:56px;height:56px;background:#10233A;flex:none\">\n                    <span style=\"font:700 18px/1 Archivo,sans-serif;letter-spacing:.04em;color:#F2F0EC\">{{ uAsesorIni }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:2px;min-width:0\">\n                    <span style=\"font:500 12px/1 Archivo,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#6E7378\">Asesor asignado<\u002Fspan>\n                    <span style=\"font:500 16px/1.3 Archivo,sans-serif;color:#10233A\">{{ uAsesor }}<\u002Fspan>\n                    <span style=\"font:400 14px/1.3 Archivo,sans-serif;color:#6E7378;font-variant-numeric:tabular-nums\">442 000 0000 ext. {{ uAsesorExt }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Faside>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section style=\"padding:clamp(40px,6vw,88px) clamp(16px,4vw,48px) {{ padSimilares }};border-top:3px solid #10233A\">\n          <div style=\"max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(20px,2.5vw,32px)\">\n            <h2 style=\"margin:0;font:700 clamp(24px,3vw,40px)/1.08 Archivo,sans-serif;letter-spacing:-0.02em;color:#10233A\">Unidades similares<\u002Fh2>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:clamp(16px,1.6vw,24px)\">\n              <sc-for list=\"{{ similares }}\" as=\"t\" hint-placeholder-count=\"4\">\n                <dc-import name=\"TarjetaUnidad\" t=\"{{ t }}\" marcador=\"{{ marcador }}\" sc-camel-on-comparar=\"{{ toggleComparar }}\" sc-camel-on-abrir=\"{{ irUnidad }}\" hint-size=\"100%,470px\"><\u002Fdc-import>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ esComparar }}\">\n      <div>\n        <section style=\"padding:clamp(26px,3.5vw,48px) clamp(16px,4vw,48px) clamp(20px,2.5vw,30px)\">\n          <div style=\"max-width:1440px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px\">\n            <div style=\"display:flex;flex-direction:column;gap:6px\">\n              <h1 style=\"margin:0;font:700 clamp(28px,3.4vw,44px)/1.06 Archivo,sans-serif;letter-spacing:-0.02em;color:#10233A\">Comparar unidades<\u002Fh1>\n              <span style=\"font:500 16px/1 Archivo,sans-serif;color:#6E7378;font-variant-numeric:tabular-nums\">{{ compHeaderTxt }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ compListo }}\">\n              <label style=\"display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none\">\n                <input type=\"checkbox\" checked=\"{{ soloDif }}\" sc-camel-on-change=\"{{ toggleSoloDif }}\" style=\"width:18px;height:18px;margin:0;accent-color:#C42B1C;cursor:pointer\">\n                <span style=\"font:500 15px/1 Archivo,sans-serif;color:#10233A\">Mostrar solo diferencias<\u002Fspan>\n              <\u002Flabel>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <div aria-hidden=\"true\" style=\"height:6px;background-image:repeating-linear-gradient(45deg,#C42B1C 0,#C42B1C 6px,#F2F0EC 6px,#F2F0EC 12px)\"><\u002Fdiv>\n\n        <section style=\"padding:clamp(24px,3vw,40px) clamp(16px,4vw,48px) clamp(60px,8vw,120px)\">\n          <div style=\"max-width:1440px;margin:0 auto\">\n            <sc-if value=\"{{ compVacio }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:flex;flex-direction:column;align-items:flex-start;gap:18px;padding:clamp(28px,4vw,56px);background:#E3E0DA;border-left:3px solid #10233A\">\n                <h2 style=\"margin:0;max-width:34ch;font:700 clamp(20px,2.2vw,28px)/1.25 Archivo,sans-serif;letter-spacing:-0.02em;color:#10233A\">Marca la casilla «Comparar» en dos o tres unidades del catálogo para verlas lado a lado.<\u002Fh2>\n                <p style=\"margin:0;max-width:62ch;font:400 15px/1.6 Archivo,sans-serif;color:#10233A\">La comparación usa la misma ficha técnica de cada unidad, así que puedes contrastar potencia, kilometraje y capacidad renglón por renglón sin cambiar de pestaña.<\u002Fp>\n                <button type=\"button\" sc-camel-on-click=\"{{ irCatalogo }}\" style=\"height:50px;padding:0 24px;border:0;border-radius:2px;background:#C42B1C;color:#F2F0EC;font:500 16px/1 Archivo,sans-serif;cursor:pointer\">Ir al catálogo<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ compListo }}\">\n              <div style=\"overflow-x:auto;border:1px solid rgba(16,35,58,.14)\">\n                <div style=\"display:grid;grid-template-columns:{{ colsComparar }};min-width:{{ minComparar }}\">\n                  <div style=\"position:sticky;left:0;z-index:2;background:#10233A;padding:18px 14px\">\n                    <span style=\"font:700 12px/1 Archivo,sans-serif;letter-spacing:.12em;color:#F2F0EC\">ESPECIFICACIÓN<\u002Fspan>\n                  <\u002Fdiv>\n                  <sc-for list=\"{{ compCols }}\" as=\"cl\" hint-placeholder-count=\"3\">\n                    <div style=\"display:flex;flex-direction:column;gap:12px;padding:14px;background:#E3E0DA;border-left:1px solid rgba(16,35,58,.14)\">\n                      <div style=\"position:relative;aspect-ratio:4/3;background:#8B8F94\">\n                        <img src=\"{{ cl.foto }}\" alt=\"{{ cl.alt }}\" sc-camel-on-error=\"{{ fotoFallo }}\" style=\"position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover\">\n                        <div style=\"position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;height:32px;padding:0 10px;background:#10233A\">\n                          <span style=\"color:#F2F0EC;font:700 11px/1 Archivo,sans-serif;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ cl.designacion }}<\u002Fspan>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                      <div style=\"display:flex;flex-direction:column\">\n                        <button type=\"button\" sc-camel-on-click=\"{{ cl.abrir }}\" style=\"padding:0;border:0;background:none;color:#10233A;font:700 17px/1.25 Archivo,sans-serif;letter-spacing:-0.02em;text-align:left;cursor:pointer;border-bottom:1px solid rgba(16,35,58,.32)\">{{ cl.titulo }}<\u002Fbutton>\n                      <\u002Fdiv>\n                      <span style=\"font:700 24px/1 Archivo,sans-serif;color:#C42B1C;font-variant-numeric:tabular-nums\">{{ cl.precio }}<\u002Fspan>\n                      <div style=\"display:flex;gap:8px\">\n                        <a href=\"{{ cl.wa }}\" style=\"flex:1;display:flex;align-items:center;justify-content:center;height:44px;border-radius:2px;background:#C42B1C;color:#F2F0EC;font:500 14px/1 Archivo,sans-serif\">WhatsApp<\u002Fa>\n                        <button type=\"button\" sc-camel-on-click=\"{{ cl.quitar }}\" aria-label=\"Quitar de la comparación\" style=\"width:44px;height:44px;border:1px solid rgba(16,35,58,.32);border-radius:2px;background:none;color:#10233A;font:400 18px/1 Archivo,sans-serif;cursor:pointer;flex:none\">×<\u002Fbutton>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                  <sc-for list=\"{{ compFilas }}\" as=\"fl\" hint-placeholder-count=\"14\">\n                    <div style=\"{{ fl.estiloK }}\">\n                      <span style=\"font:500 13px/1.4 'IBM Plex Mono',monospace;color:#6E7378\">{{ fl.k }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <sc-for list=\"{{ fl.celdas }}\" as=\"cd\" hint-placeholder-count=\"3\">\n                      <div style=\"{{ cd.estilo }}\">\n                        <span style=\"font:500 14px/1.4 'IBM Plex Mono',monospace;color:#10233A;font-variant-numeric:tabular-nums\">{{ cd.v }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ compSinDif }}\">\n                <p style=\"margin:20px 0 0;font:400 15px/1.6 Archivo,sans-serif;color:#6E7378\">Estas unidades no difieren en ninguna especificación de la ficha. Quita el filtro de diferencias para ver la tabla completa.<\u002Fp>\n              <\u002Fsc-if>\n              <p style=\"margin:20px 0 0;max-width:70ch;font:400 13px/1.6 Archivo,sans-serif;color:#6E7378\">El filete rojo al costado de una celda marca el renglón donde las unidades no coinciden.<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ esFinanciamiento }}\">\n      <div>\n        <section style=\"padding:clamp(26px,3.5vw,48px) clamp(16px,4vw,48px) clamp(20px,2.5vw,30px)\">\n          <div style=\"max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:12px\">\n            <h1 style=\"margin:0;font:700 clamp(28px,3.4vw,44px)/1.06 Archivo,sans-serif;letter-spacing:-0.02em;color:#10233A\">Financiamiento<\u002Fh1>\n            <p style=\"margin:0;max-width:70ch;font:400 clamp(16px,1.3vw,18px)/1.6 Archivo,sans-serif;color:#10233A\">Trabajamos con arrendadoras y banca especializada en transporte de carga. Con dos años de comprobantes de ingreso la autorización sale en 48 horas hábiles.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <div aria-hidden=\"true\" style=\"height:6px;background-image:repeating-linear-gradient(45deg,#C42B1C 0,#C42B1C 6px,#F2F0EC 6px,#F2F0EC 12px)\"><\u002Fdiv>\n\n        <section style=\"padding:clamp(28px,4vw,56px) clamp(16px,4vw,48px)\">\n          <div style=\"max-width:1440px;margin:0 auto\">\n            <dc-import name=\"Calculadora\" sc-camel-precio-inicial=\"{{ calcPrecio }}\" ancho=\"{{ anchoVista }}\" hint-size=\"100%,440px\"><\u002Fdc-import>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section style=\"padding:clamp(44px,6vw,96px) clamp(16px,4vw,48px);border-top:3px solid #10233A\">\n          <div style=\"max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(22px,3vw,36px)\">\n            <h2 style=\"margin:0;font:700 clamp(26px,3.2vw,40px)/1.08 Archivo,sans-serif;letter-spacing:-0.02em;color:#10233A\">Esquemas disponibles<\u002Fh2>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1px;background:rgba(16,35,58,.14);border:1px solid rgba(16,35,58,.14)\">\n              <sc-for list=\"{{ esquemas }}\" as=\"es\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;flex-direction:column;gap:16px;padding:clamp(22px,2.6vw,32px);background:#F2F0EC;min-width:0\">\n                  <h3 style=\"margin:0;font:700 22px/1.2 Archivo,sans-serif;letter-spacing:-0.02em;color:#10233A\">{{ es.t }}<\u002Fh3>\n                  <p style=\"margin:0;max-width:44ch;font:400 15px/1.6 Archivo,sans-serif;color:#6E7378\">{{ es.d }}<\u002Fp>\n                  <div style=\"display:flex;flex-direction:column;border-top:1px solid rgba(16,35,58,.14);margin-top:auto\">\n                    <sc-for list=\"{{ es.filas }}\" as=\"fl\" hint-placeholder-count=\"3\">\n                      <div style=\"display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid rgba(16,35,58,.14)\">\n                        <span style=\"font:400 14px/1.4 Archivo,sans-serif;color:#6E7378\">{{ fl.k }}<\u002Fspan>\n                        <span style=\"font:500 14px/1.4 Archivo,sans-serif;color:#10233A;font-variant-numeric:tabular-nums;text-align:right\">{{ fl.v }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:16px;padding:clamp(22px,2.6vw,32px);background:#10233A\">\n              <h3 style=\"margin:0;font:700 22px/1.25 Archivo,sans-serif;letter-spacing:-0.02em;color:#F2F0EC\">Qué necesitas para solicitar<\u002Fh3>\n              <ul style=\"margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px 28px\">\n                <sc-for list=\"{{ requisitos }}\" as=\"rq\" hint-placeholder-count=\"6\">\n                  <li style=\"display:flex;align-items:flex-start;gap:10px;font:400 15px/1.5 Archivo,sans-serif;color:#E3E0DA\">\n                    <span aria-hidden=\"true\" style=\"width:8px;height:8px;margin-top:7px;border-radius:50%;background:#E8B23A;flex:none\"><\u002Fspan>{{ rq }}<\u002Fli>\n                <\u002Fsc-for>\n              <\u002Ful>\n              <button type=\"button\" sc-camel-on-click=\"{{ abrirModalCredito }}\" style=\"align-self:flex-start;height:52px;padding:0 24px;border:0;border-radius:2px;background:#C42B1C;color:#F2F0EC;font:500 16px/1 Archivo,sans-serif;cursor:pointer\">Iniciar mi solicitud<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ esContacto }}\">\n      <div>\n        <section style=\"padding:clamp(26px,3.5vw,48px) clamp(16px,4vw,48px) clamp(20px,2.5vw,30px)\">\n          <div style=\"max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:12px\">\n            <h1 style=\"margin:0;font:700 clamp(28px,3.4vw,44px)/1.06 Archivo,sans-serif;letter-spacing:-0.02em;color:#10233A\">Contacto<\u002Fh1>\n            <p style=\"margin:0;max-width:68ch;font:400 clamp(16px,1.3vw,18px)/1.6 Archivo,sans-serif;color:#10233A\">Escríbenos qué ruta corres y qué carga mueves. Con eso el asesor te manda dos o tres unidades que de verdad te sirvan, no el catálogo completo.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <div aria-hidden=\"true\" style=\"height:6px;background-image:repeating-linear-gradient(45deg,#C42B1C 0,#C42B1C 6px,#F2F0EC 6px,#F2F0EC 12px)\"><\u002Fdiv>\n\n        <section style=\"padding:clamp(28px,4vw,56px) clamp(16px,4vw,48px) clamp(60px,8vw,110px)\">\n          <div style=\"max-width:1440px;margin:0 auto;display:grid;grid-template-columns:{{ colsUbicacion }};gap:clamp(28px,4vw,56px);align-items:start\">\n            <div style=\"min-width:0\">\n              <sc-if value=\"{{ modalEnviado }}\">\n                <div style=\"display:flex;flex-direction:column;gap:16px;padding:clamp(24px,3vw,36px);background:#E3E0DA;border-left:3px solid #1F6F4A\">\n                  <div style=\"display:flex;align-items:center;gap:10px\">\n                    <span aria-hidden=\"true\" style=\"width:10px;height:10px;border-radius:50%;background:#1F6F4A;flex:none\"><\u002Fspan>\n                    <span style=\"font:500 13px/1 Archivo,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#1F6F4A\">Solicitud registrada<\u002Fspan>\n                  <\u002Fdiv>\n                  <p style=\"margin:0;max-width:56ch;font:400 17px/1.6 Archivo,sans-serif;color:#10233A\">Gracias. Un asesor te contacta por WhatsApp dentro del siguiente día hábil con las unidades que coinciden con lo que buscas.<\u002Fp>\n                  <p style=\"margin:0;max-width:56ch;font:400 13px/1.6 Archivo,sans-serif;color:#6E7378\">Maqueta de presentación: el formulario valida en cliente y no envía datos a ningún servidor.<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ modalFormulario }}\" hint-placeholder-val=\"{{ true }}\">\n                <form sc-camel-on-submit=\"{{ enviarForm }}\" style=\"display:flex;flex-direction:column;gap:18px;padding:clamp(22px,3vw,32px);border:1px solid rgba(16,35,58,.14)\">\n                  <sc-for list=\"{{ campos }}\" as=\"cp\" hint-placeholder-count=\"5\">\n                    <label style=\"display:flex;flex-direction:column;gap:6px\">\n                      <span style=\"font:500 12px/1 Archivo,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#6E7378\">{{ cp.et }}<\u002Fspan>\n                      <input type=\"{{ cp.tipo }}\" value=\"{{ cp.valor }}\" sc-camel-on-change=\"{{ cp.on }}\" placeholder=\"{{ cp.ph }}\" aria-invalid=\"{{ cp.mal }}\" style=\"{{ cp.estilo }}\">\n                      <sc-if value=\"{{ cp.mal }}\"><span style=\"font:400 13px/1.5 Archivo,sans-serif;color:#C42B1C\">{{ cp.error }}<\u002Fspan><\u002Fsc-if>\n                    <\u002Flabel>\n                  <\u002Fsc-for>\n                  <label style=\"display:flex;flex-direction:column;gap:6px\">\n                    <span style=\"font:500 12px/1 Archivo,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#6E7378\">Forma de pago prevista<\u002Fspan>\n                    <sc-raw-select value=\"{{ formPago }}\" sc-camel-on-change=\"{{ setPago }}\" style=\"height:48px;padding:0 12px;border:1px solid rgba(16,35,58,.32);border-radius:2px;background:#F2F0EC;color:#10233A;font:400 16px/1 Archivo,sans-serif;cursor:pointer\">\n                      <option value=\"\">Selecciona una opción<\u002Foption>\n                      <option value=\"Contado\">Contado<\u002Foption>\n                      <option value=\"Crédito simple\">Crédito simple<\u002Foption>\n                      <option value=\"Arrendamiento puro\">Arrendamiento puro<\u002Foption>\n                      <option value=\"Unidad a cuenta más diferencia\">Unidad a cuenta más diferencia<\u002Foption>\n                    <\u002Fsc-raw-select>\n                  <\u002Flabel>\n                  <button type=\"submit\" style=\"height:54px;border:0;border-radius:2px;background:#C42B1C;color:#F2F0EC;font:500 17px/1 Archivo,sans-serif;cursor:pointer;transition:background .16s ease-out\" style-hover=\"background:#10233A\">Enviar solicitud<\u002Fbutton>\n                <\u002Fform>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:clamp(20px,2.5vw,28px);min-width:0\">\n              <div style=\"position:relative;aspect-ratio:4/3;background:#E3E0DA;border:1px solid rgba(16,35,58,.14);overflow:hidden\">\n                <svg sc-camel-view-box=\"0 0 400 300\" sc-camel-preserve-aspect-ratio=\"none\" aria-hidden=\"true\" style=\"position:absolute;inset:0;width:100%;height:100%\">\n                  <rect width=\"400\" height=\"300\" fill=\"#E3E0DA\"><\u002Frect>\n                  <path d=\"M0 210 h400\" stroke=\"#C9C5BC\" stroke-width=\"14\"><\u002Fpath>\n                  <path d=\"M0 210 h400\" stroke=\"#F2F0EC\" stroke-width=\"2\" stroke-dasharray=\"10 8\"><\u002Fpath>\n                  <path d=\"M150 0 v300\" stroke=\"#C9C5BC\" stroke-width=\"8\"><\u002Fpath>\n                  <path d=\"M280 0 L400 130\" stroke=\"#C9C5BC\" stroke-width=\"6\"><\u002Fpath>\n                  <circle cx=\"150\" cy=\"210\" r=\"15\" fill=\"#C42B1C\"><\u002Fcircle>\n                  <circle cx=\"150\" cy=\"210\" r=\"5\" fill=\"#F2F0EC\"><\u002Fcircle>\n                <\u002Fsvg>\n                <div style=\"position:absolute;left:0;bottom:0;right:0;display:flex;align-items:center;height:40px;padding:0 14px;background:#10233A\">\n                  <span style=\"color:#F2F0EC;font:700 13px/1 Archivo,sans-serif;letter-spacing:.08em\">PISO DE VENTA — QUERÉTARO<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;border-top:1px solid rgba(16,35,58,.14)\">\n                <sc-for list=\"{{ datosContacto }}\" as=\"dc\" hint-placeholder-count=\"4\">\n                  <div style=\"display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;padding:14px 0;border-bottom:1px solid rgba(16,35,58,.14)\">\n                    <span style=\"font:500 14px/1.4 Archivo,sans-serif;color:#6E7378;min-width:110px\">{{ dc.k }}<\u002Fspan>\n                    <span style=\"font:400 16px/1.5 Archivo,sans-serif;color:#10233A;font-variant-numeric:tabular-nums;max-width:34ch\">{{ dc.v }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ esNosotros }}\">\n      <div>\n        <section style=\"padding:clamp(26px,3.5vw,48px) clamp(16px,4vw,48px) clamp(20px,2.5vw,30px)\">\n          <div style=\"max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:12px\">\n            <h1 style=\"margin:0;max-width:26ch;font:700 clamp(28px,3.6vw,48px)/1.04 Archivo,sans-serif;letter-spacing:-0.02em;color:#10233A\">Doce años vendiendo unidades que siguen trabajando<\u002Fh1>\n            <p style=\"margin:0;max-width:70ch;font:400 clamp(16px,1.3vw,18px)/1.6 Archivo,sans-serif;color:#10233A\">HD TE Soluciones abrió en 2014 con cuatro unidades en un patio rentado sobre la federal 57. Hoy movemos entre 60 y 80 unidades al año desde un piso propio de 4,200 metros cuadrados con taller de inspección dentro.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <div aria-hidden=\"true\" style=\"height:6px;background-image:repeating-linear-gradient(45deg,#C42B1C 0,#C42B1C 6px,#F2F0EC 6px,#F2F0EC 12px)\"><\u002Fdiv>\n\n        <section style=\"padding:clamp(28px,4vw,56px) clamp(16px,4vw,48px)\">\n          <div style=\"max-width:1440px;margin:0 auto;display:grid;grid-template-columns:{{ colsUbicacion }};gap:clamp(28px,4vw,56px);align-items:start\">\n            <div style=\"position:relative;aspect-ratio:4/3;background:#E3E0DA;min-width:0\">\n              <img src=\"{{ fotoPiso }}\" alt=\"Patio del piso de venta de HD TE Soluciones con unidades en línea\" sc-camel-on-error=\"{{ fotoFallo }}\" style=\"position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover\">\n              <div style=\"position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;height:40px;padding:0 14px;background:#10233A\">\n                <span style=\"color:#F2F0EC;font:700 13px/1 Archivo,sans-serif;letter-spacing:.08em\">PISO DE VENTA — FEDERAL 57 KM 24<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:clamp(20px,2.5vw,30px);min-width:0\">\n              <h2 style=\"margin:0;font:700 clamp(24px,2.8vw,36px)/1.1 Archivo,sans-serif;letter-spacing:-0.02em;color:#10233A\">El piso de venta<\u002Fh2>\n              <div style=\"display:flex;flex-direction:column;border-top:1px solid rgba(16,35,58,.14)\">\n                <sc-for list=\"{{ datosPiso }}\" as=\"dp\" hint-placeholder-count=\"5\">\n                  <div style=\"display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;padding:14px 0;border-bottom:1px solid rgba(16,35,58,.14)\">\n                    <span style=\"font:500 14px/1.4 Archivo,sans-serif;color:#6E7378;min-width:130px\">{{ dp.k }}<\u002Fspan>\n                    <span style=\"font:400 16px/1.5 Archivo,sans-serif;color:#10233A;font-variant-numeric:tabular-nums;max-width:34ch\">{{ dp.v }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <button type=\"button\" sc :1px;background:rgba(16,35,58,.14);border:1px solid rgba(16,35,58,.14);border-top:0\">\n                <label style=\"flex:1 1 150px;display:flex;flex-direction:column;gap:4px;padding:11px 13px;background:#F2F0EC;min-width:0\">\n                  <span style=\"font:500 11px/1 Archivo,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:#6E7378\">Tipo de unidad<\u002Fspan>\n                  <sc-raw-select value=\"{{ bqTipo }}\" sc-camel-on-change=\"{{ setBqTipo }}\" style=\"border:0;background:none;color:#10233A;font:500 15px/1.2 Archivo,sans-serif;padding:0;cursor:pointer;min-width:0\">\n                    <option value=\"\">Cualquiera<\u002Foption>\n                    <sc-for list=\"{{ tiposLista }}\" as=\"tp\" hint-placeholder-count=\"3\"><option value=\"{{ tp }}\">{{ tp }}<\u002Foption><\u002Fsc-for>\n                  <\u002Fsc-raw-select>\n                <\u002Flabel>\n                <label style=\"flex:1 1 150px;display:flex;flex-direction:column;gap:4px;padding:11px 13px;background:#F2F0EC;min-width:0\">\n                  <span style=\"font:500 11px/1 Archivo,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:#6E7378\">Marca<\u002Fspan>\n                  <sc-raw-select value=\"{{ bqMarca }}\" sc-camel-on-change=\"{{ setBqMarca }}\" style=\"border:0;background:none;color:#10233A;font:500 15px/1.2 Archivo,sans-serif;padding:0;cursor:pointer;min-width:0\">\n                    <option value=\"\">Cualquiera<\u002Foption>\n                    <sc-for list=\"{{ marcasLista }}\" as=\"mc\" hint-placeholder-count=\"3\"><option value=\"{{ mc }}\">{{ mc }}<\u002Foption><\u002Fsc-for>\n                  <\u002Fsc-raw-select>\n                <\u002Flabel>\n                <label style=\"flex:1 1 120px;display:flex;flex-direction:column;gap:4px;padding:11px 13px;background:#F2F0EC;min-width:0\">\n                  <span style=\"font:500 11px/1 Archivo,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:#6E7378\">Año desde<\u002Fspan>\n                  <sc-raw-select value=\"{{ bqAnio }}\" sc-camel-on-change=\"{{ setBqAnio }}\" style=\"border:0;background:none;color:#10233A;font:500 15px/1.2 Archivo,sans-serif;padding:0;cursor:pointer;font-variant-numeric:tabular-nums;min-width:0\">\n                    <option value=\"\">2015<\u002Foption>\n                    <sc-for list=\"{{ aniosLista }}\" as=\"an\" hint-placeholder-count=\"3\"><option value=\"{{ an }}\">{{ an }}<\u002Foption><\u002Fsc-for>\n                  <\u002Fsc-raw-select>\n                <\u002Flabel>\n                <label style=\"flex:1 1 150px;display:flex;flex-direction:column;gap:4px;padding:11px 13px;background:#F2F0EC;min-width:0\">\n                  <span style=\"font:500 11px/1 Archivo,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:#6E7378\">Presupuesto máximo<\u002Fspan>\n                  <sc-raw-select value=\"{{ bqPres }}\" sc-camel-on-change=\"{{ setBqPres }}\" style=\"border:0;background:none;color:#10233A;font:500 15px/1.2 Archivo,sans-serif;padding:0;cursor:pointer;font-variant-numeric:tabular-nums;min-width:0\">\n                    <option value=\"\">Sin límite<\u002Foption>\n                    <option value=\"800000\">$800,000<\u002Foption>\n                    <option value=\"1200000\">$1,200,000<\u002Foption>\n                    <option value=\"1600000\">$1,600,000<\u002Foption>\n                    <option value=\"2200000\">$2,200,000<\u002Foption>\n                  <\u002Fsc-raw-select>\n                <\u002Flabel>\n                <button type=\"submit\" style=\"flex:1 1 160px;min-height:66px;padding:0 22px;border:0;border-radius:2px;background:#C42B1C;color:#F2F0EC;font:500 16px/1 Archivo,sans-serif;cursor:pointer;transition:background .16s ease-out\" style-hover=\"background:#10233A\">Ver unidades<\u002Fbutton>\n              <\u002Fform>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <div aria-hidden=\"true\" style=\"height:6px;margin-top:cl
